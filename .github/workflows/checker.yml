name: Twitter Buyback Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-tweets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests twitter-cli agent-client agent-reach google-genai pillow

      - name: Run Bookoff Monitor
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/xpost_bookoff.py

      - name: Run Mulan Monitor
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_MULAN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/xpost_mulan.py

      - name: Commit states and queue data
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update tweet states and add mulan queue data [skip ci]"
          file_pattern: "last_tweet_id_*.txt data/mulan_queue/*"

      # 新しいOCRデータがコミットされたときだけダッシュボード（Render）を再デプロイする
      - name: Trigger Render Deploy
        if: steps.auto_commit.outputs.changes_detected == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD -- data/mulan_queue | grep -q .; then
            echo "No new mulan queue data. Skipping deployment trigger."
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping deployment trigger."
          fi
