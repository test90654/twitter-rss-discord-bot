name: Test Mulan Image Collector

on:
  workflow_dispatch: # 手動でいつでもテスト実行できるようにする
  # schedule:
  #   - cron: '0 * * * *' # 必要に応じて定期実行の有効化にご活用ください

permissions:
  contents: write

jobs:
  collect-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests twitter-cli

      - name: Run Mulan Image Collector Test
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          python src/test_mulan_collector.py

      - name: Commit collected queue data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add collected Mulan images and metadata for testing [skip ci]"
          file_pattern: "data/mulan_queue/*"

      - name: Trigger Render Deploy
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping deployment trigger."
          fi
