name: Ramen backfill (one-time)

# 過去1年分の「今週の予定」「本日限定」を読み込んで data/ に記録する一回限りのジョブ（終わったら削除する）
on:
  push:
    branches: [ramen-weekly-menu]
    paths: ['.github/workflows/ramen_backfill_once.yml']

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install requests twitter-cli google-genai pydantic gspread
      - name: Backfill
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/ramen_weekly.py --backfill 1200 --no-notify
      - name: Show result
        if: always()
        run: cat data/ramen_stats.md || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ramen_weekly.json data/ramen_stats.md || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "過去1年分の限定メニュー履歴を読み込み [skip ci]"
          git push
